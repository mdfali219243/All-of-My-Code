<!DOCTYPE html>
<html lang="en">

    <head>
        <title>Task Board</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                darkMode: 'class',
            }
        </script>
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style/home_page.css">
        <link rel="stylesheet" href="style/tasks.css">
        <link rel="stylesheet" href="style/dark_mode.css">
    </head>

    <body class="text-gray-900 dark:text-gray-100">

        <!-- Chat Overlay for Blur Effect -->
        <div id="chatOverlay" class="chat-overlay hidden"></div>

        <div id="floatingChatContainer" class="floating-chat-container">
            <button id="closeChatBtn" class="close-chat-btn" title="Close Chat">
                <i class="fas fa-times"></i>
            </button>
            <div id="chatMessages" class="chat-messages-floating">
                <!-- Chat history will appear here -->
            </div>
            <div class="chat-input-box">
                <input type="text" id="calendarChatInput" placeholder="Ask about your tasks..." autocomplete="off">
                <button id="calendarChatSendBtn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>

        <!-- Feature Menu -->
        <div class="feature-menu" id="featureMenu">
            <div class="p-4 flex items-center justify-between border-b border-gray-200">
                <h2 class="text-xl font-semibold text-gray-700 dark:text-gray-200">Calendar Menu</h2>
                <button class="icon-button" id="closeMenuBtn" aria-label="Close navigation menu">
                    <svg fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                    </svg>
                </button>
            </div>
            <ul class="py-2">
                <li><a href="index.html"
                        class="block px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">My
                        Calendar</a></li>
                <li><a href="events.html"
                        class="block px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">Events</a>
                </li>
                <li><a href="tasks.html"
                        class="block px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">Tasks</a>
                </li>
                <li><a href="settings.html"
                        class="block px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">Settings</a>
                </li>
            </ul>
        </div>

        <!-- Overlay for when the menu is open -->
        <div class="overlay" id="overlay"></div>

        <!-- Header -->
        <div class="header">
            <div class="left-section">
                <button class="icon-button" id="openMenuBtn" aria-label="Open navigation menu">
                    <svg fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
                    </svg>
                </button>
                <a href="index.html" class="icon-button ml-2" aria-label="Back to Calendar">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <h1 class="text-xl font-bold ml-4">Task Board</h1>

                <!-- View Switcher -->
                <div class="flex bg-gray-200 dark:bg-gray-700 rounded-lg p-1 ml-6">
                    <button id="boardViewBtn"
                        class="px-3 py-1 rounded-md text-sm font-medium bg-white dark:bg-gray-600 shadow-sm transition-all">
                        <i class="fas fa-columns mr-1"></i> Board
                    </button>
                    <button id="listViewBtn"
                        class="px-3 py-1 rounded-md text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-600 transition-all">
                        <i class="fas fa-list mr-1"></i> List
                    </button>
                    <button id="weekViewBtn"
                        class="px-3 py-1 rounded-md text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-600 transition-all">
                        <i class="fas fa-calendar-week mr-1"></i> Week
                    </button>
                </div>
            </div>
            <div class="right-section">
                <button class="theme-toggle" id="themeToggle">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>

        <!-- Kanban Board -->
        <div class="board-container">
            <!-- To Do Column -->
            <div class="column">
                <div class="column-header">
                    <span>To Do</span>
                    <span class="text-sm text-gray-500 bg-gray-200 dark:bg-gray-700 px-2 py-1 rounded-full">3</span>
                </div>
                <div class="task-list" id="todo-list">
                    <!-- Tasks will be injected here -->
                </div>
                <button class="add-task-btn" data-column="todo-list">
                    <i class="fas fa-plus"></i> Add Card
                </button>
            </div>

            <!-- In Progress Column -->
            <div class="column">
                <div class="column-header">
                    <span>In Progress</span>
                    <span class="text-sm text-gray-500 bg-gray-200 dark:bg-gray-700 px-2 py-1 rounded-full">1</span>
                </div>
                <div class="task-list" id="inprogress-list">
                    <!-- Tasks will be injected here -->
                </div>
                <button class="add-task-btn" data-column="inprogress-list">
                    <i class="fas fa-plus"></i> Add Card
                </button>
            </div>

            <!-- Done Column -->
            <div class="column">
                <div class="column-header">
                    <span>Done</span>
                    <span class="text-sm text-gray-500 bg-gray-200 dark:bg-gray-700 px-2 py-1 rounded-full">2</span>
                </div>
                <div class="task-list" id="done-list">
                    <!-- Tasks will be injected here -->
                </div>
                <button class="add-task-btn" data-column="done-list">
                    <i class="fas fa-plus"></i> Add Card
                </button>
            </div>

            <button id="addListBtn" class="add-list-main-btn">
                <i class="fas fa-plus"></i> Add another list
            </button>
        </div>

        <!-- List View Container (Hidden by default) -->
        <div id="listViewContainer" class="list-view-container hidden p-6 max-w-4xl mx-auto">
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg overflow-hidden">
                <div class="p-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
                    <h2 class="text-lg font-semibold">My Tasks</h2>
                    <button id="addListTaskBtn"
                        class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700 transition">
                        <i class="fas fa-plus mr-1"></i> Add Task
                    </button>
                </div>
                <div id="listViewContent" class="divide-y divide-gray-200 dark:divide-gray-700">
                    <!-- List items will be injected here -->
                </div>
            </div>
        </div>

        <!-- Week View Container (Hidden by default) -->
        <div id="weekViewContainer" class="list-view-container hidden p-6 max-w-6xl mx-auto">
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-4">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold">Weekly Overview</h2>
                </div>
                <div id="taskWeekGrid" class="grid grid-cols-7 gap-4 min-h-[400px]">
                    <!-- Week columns will be injected here -->
                </div>
            </div>
        </div>

        <!-- Add/Edit Task Form Modal -->
        <div id="addTaskModal"
            class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-[60]">
            <div
                class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl w-full max-w-lg overflow-hidden transform transition-all scale-100 max-h-[90vh] flex flex-col">
                <div
                    class="p-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-700/50">
                    <h3 id="addTaskModalTitle" class="text-xl font-bold">Add New Task</h3>
                    <button id="closeAddTaskModalBtn"
                        class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
                <div class="p-6 overflow-y-auto">
                    <form id="addTaskForm" class="space-y-4">
                        <input type="hidden" id="taskFormId">
                        <input type="hidden" id="taskFormColumn">

                        <div>
                            <label class="block text-sm font-semibold mb-1">Task Title <span
                                    class="text-red-500">*</span></label>
                            <input type="text" id="taskFormTitle"
                                class="w-full p-2 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-blue-500"
                                placeholder="What needs to be done?" required>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-semibold mb-1">Schedule Date</label>
                                <input type="date" id="taskFormDate"
                                    class="w-full p-2 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold mb-1">Time</label>
                                <input type="time" id="taskFormTime"
                                    class="w-full p-2 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 outline-none">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-semibold mb-1">Duration (mins)</label>
                                <input type="number" id="taskFormDuration"
                                    class="w-full p-2 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 outline-none"
                                    placeholder="e.g. 30">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold mb-1">Due Date</label>
                                <input type="date" id="taskFormDue"
                                    class="w-full p-2 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 outline-none">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold mb-2">Sub-tasks</label>
                            <div id="subtaskInputsContainer" class="space-y-2 mb-2">
                                <!-- Subtask inputs will be added here -->
                            </div>
                            <button type="button" id="addSubtaskBtn"
                                class="text-sm text-blue-600 hover:text-blue-700 dark:text-blue-400 font-medium flex items-center gap-1">
                                <i class="fas fa-plus-circle"></i> Add Sub-task
                            </button>
                        </div>
                    </form>
                </div>
                <div
                    class="p-4 border-t border-gray-200 dark:border-gray-700 flex justify-end gap-3 bg-gray-50 dark:bg-gray-700/50">
                    <button id="cancelAddTaskBtn"
                        class="px-4 py-2 text-gray-700 dark:text-gray-300 font-medium hover:bg-gray-200 dark:hover:bg-gray-600 rounded-lg transition-colors">Cancel</button>
                    <button id="saveTaskBtn"
                        class="px-6 py-2 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition-colors shadow-md">Save
                        Task</button>
                </div>
            </div>
        </div>

        <!-- Task Details Modal (View/Edit Details) -->
        <div id="taskModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
            <div
                class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden transform transition-all scale-100 max-h-[90vh] flex flex-col">
                <div
                    class="p-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-700/50">
                    <h3 id="taskModalTitle" class="text-xl font-bold truncate pr-4">Task Details</h3>
                    <div class="flex items-center gap-2">
                        <button id="editTaskDetailsBtn" class="text-blue-500 hover:text-blue-700" title="Edit Task">
                            <i class="fas fa-edit text-lg"></i>
                        </button>
                        <button id="closeTaskModalBtn"
                            class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
                            <i class="fas fa-times text-xl"></i>
                        </button>
                    </div>
                </div>
                <div class="p-6 overflow-y-auto">
                    <div id="taskModalVideo"
                        class="mb-6 hidden rounded-lg overflow-hidden bg-black aspect-video shadow-inner">
                        <!-- Video iframe will be injected here -->
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div class="space-y-4">
                            <div>
                                <label
                                    class="block text-xs uppercase tracking-wider font-bold text-gray-500 mb-1">Status</label>
                                <span id="taskModalStatus"
                                    class="inline-block px-3 py-1 rounded-full text-sm font-medium bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200">
                                    To Do
                                </span>
                            </div>
                            <div>
                                <label
                                    class="block text-xs uppercase tracking-wider font-bold text-gray-500 mb-1">Scheduled
                                    for</label>
                                <div id="taskModalSchedule"
                                    class="text-sm font-medium text-gray-800 dark:text-gray-200">
                                    Not scheduled
                                </div>
                            </div>
                        </div>
                        <div class="space-y-4">
                            <div>
                                <label
                                    class="block text-xs uppercase tracking-wider font-bold text-gray-500 mb-1">Duration</label>
                                <div id="taskModalDuration"
                                    class="text-sm font-medium text-gray-800 dark:text-gray-200">
                                    -- mins
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs uppercase tracking-wider font-bold text-gray-500 mb-1">Due
                                    Date</label>
                                <div id="taskModalDue" class="text-sm font-medium text-gray-800 dark:text-gray-200">
                                    No due date
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="subtasksViewContainer" class="hidden">
                        <label
                            class="block text-xs uppercase tracking-wider font-bold text-gray-500 mb-3 border-b pb-1">Sub-tasks</label>
                        <div id="subtasksList" class="space-y-2">
                            <!-- Subtasks will be rendered as checkboxes here -->
                        </div>
                    </div>
                </div>
                <div
                    class="p-4 border-t border-gray-200 dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-700/50">
                    <button id="deleteTaskModalBtn"
                        class="text-red-500 hover:text-red-700 font-medium flex items-center gap-1">
                        <i class="fas fa-trash-alt"></i> Delete Task
                    </button>
                    <button id="closeTaskModalFooter"
                        class="bg-gray-200 text-gray-800 px-6 py-2 rounded-lg hover:bg-gray-300 dark:bg-gray-700 dark:text-gray-200 dark:hover:bg-gray-600 font-bold transition-colors">Close</button>
                </div>
            </div>
        </div>

        <script src="javascript/theme.js"></script>
        <script src="javascript/tasks.js"></script>
        <script src="javascript/sidebar.js"></script>
        <script src="javascript/ai-chat.js"></script>
        <script src="javascript/voice-input.js"></script>
        <script src="javascript/cloud-sync.js"></script>
        <script src="javascript/menu.js"></script>
    </body>

</html>
