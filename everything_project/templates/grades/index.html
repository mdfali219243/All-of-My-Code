<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grades — StudyFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='shared/design-system.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='shared/app-theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='grades/style/dark_mode.css') }}">
    <style>
        .sf-grades-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }
        .sf-grades-card {
            width: 100%;
            max-width: 42rem;
            padding: 2rem;
            border-radius: var(--sf-radius-lg);
        }
        .sf-grades-title {
            font-size: 1.75rem;
            font-weight: 800;
            text-align: center;
            margin: 0 0 0.35rem;
            background: linear-gradient(135deg, #fff, #c7d2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .sf-grades-sub {
            text-align: center;
            color: var(--sf-text-muted);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .sf-grade-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 1rem;
            padding: 0.9rem 1rem;
            border-radius: 0.75rem;
            transition: background 0.2s;
        }
        .sf-grade-row:hover { background: var(--sf-surface-hover); }
        .sf-grade-row + .sf-grade-row { border-top: 1px solid var(--sf-border); }
        .sf-grade-header {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--sf-text-dim);
            border-top: none !important;
        }
        .sf-grade-value {
            font-weight: 700;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #a5b4fc, #c4b5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .sf-grade-avg {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: var(--sf-radius);
            text-align: center;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.08));
            border: 1px solid rgba(99, 102, 241, 0.2);
        }
        .sf-grade-avg span { color: #a5b4fc; font-weight: 600; }
    </style>
</head>
<body class="sf-app sf-mesh-bg has-sf-sidebar sf-themed">
    {% include 'partials/feature_menu.html' %}

    <div class="sf-grades-wrap">
        <div class="sf-grades-card sf-glass">
            <h1 class="sf-grades-title">Grade Tracker</h1>
            <p class="sf-grades-sub">See where you shine — and where to focus next.</p>

            <div class="sf-grade-row sf-grade-header">
                <div>Subject</div>
                <div>Grade</div>
            </div>
            <div class="sf-grade-row">
                <div>Math</div>
                <div class="sf-grade-value">90</div>
            </div>
            <div class="sf-grade-row">
                <div>English</div>
                <div class="sf-grade-value">85</div>
            </div>
            <div class="sf-grade-row">
                <div>Science</div>
                <div class="sf-grade-value">80</div>
            </div>
            <div class="sf-grade-row">
                <div>History</div>
                <div class="sf-grade-value">85</div>
            </div>
            <div class="sf-grade-row">
                <div>Geography</div>
                <div class="sf-grade-value">80</div>
            </div>

            <div class="sf-grade-avg">
                Class average: <span>84%</span> — keep pushing!
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='shared/feature-menu.js') }}"></script>
</body>
</html>
