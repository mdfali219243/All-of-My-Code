<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — StudyFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='shared/design-system.css') }}">
    <!-- Use Outfit font for premium tech feel -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='shared/auth.css') }}">
</head>
<body class="auth-page auth-mesh-bg text-gray-100 flex items-center justify-center min-h-screen p-4 overflow-hidden relative font-sans">
    
    <!-- Decorative floating glowing blobs -->
    <div class="absolute w-96 h-96 rounded-full bg-blue-500/10 blur-[100px] top-10 left-10 pointer-events-none animate-pulse"></div>
    <div class="absolute w-96 h-96 rounded-full bg-purple-500/10 blur-[100px] bottom-10 right-10 pointer-events-none animate-pulse"></div>

    <div class="auth-glass w-full max-w-md p-8 rounded-3xl shadow-2xl relative z-10 transform hover:scale-[1.01] transition-all duration-300">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-500 to-indigo-600 shadow-lg shadow-indigo-500/30 mb-4 transform hover:rotate-6 transition-transform duration-300">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <p class="text-xs font-bold uppercase tracking-widest text-indigo-400 mb-2">StudyFlow</p>
            <h1 class="text-3xl font-extrabold bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">Welcome back</h1>
            <p class="text-sm text-slate-400 mt-2 font-light">Your calm, focused study workspace awaits</p>
        </div>

        {% if error %}
        <div class="mb-6 p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-300 text-sm flex items-center gap-3 animate-shake">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST" class="space-y-6">
            {{ csrf_input }}
            
            <div class="relative group">
                <input type="text" id="username" name="username" placeholder=" " required
                       class="peer w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl text-white placeholder-transparent focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/20 transition-all duration-200">
                <label for="username" 
                       class="absolute left-5 top-4 text-slate-400 text-sm transition-all duration-200 pointer-events-none
                              peer-placeholder-shown:text-base peer-placeholder-shown:top-4 
                              peer-focus:top-1.5 peer-focus:text-xs peer-focus:text-blue-400
                              not-placeholder-shown:top-1.5 not-placeholder-shown:text-xs not-placeholder-shown:text-blue-400">
                    Username
                </label>
            </div>

            <div class="relative group">
                <input type="password" id="password" name="password" placeholder=" " required
                       class="peer w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl text-white placeholder-transparent focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/20 transition-all duration-200">
                <label for="password" 
                       class="absolute left-5 top-4 text-slate-400 text-sm transition-all duration-200 pointer-events-none
                              peer-placeholder-shown:text-base peer-placeholder-shown:top-4 
                              peer-focus:top-1.5 peer-focus:text-xs peer-focus:text-blue-400
                              not-placeholder-shown:top-1.5 not-placeholder-shown:text-xs not-placeholder-shown:text-blue-400">
                    Password
                </label>
            </div>

            <button type="submit" 
                    class="w-full py-4 rounded-2xl bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-semibold shadow-lg shadow-indigo-500/20 hover:shadow-indigo-500/40 transform hover:-translate-y-[1px] active:translate-y-0 transition-all duration-200">
                Sign In
            </button>
        </form>

        <div class="mt-8 text-center border-t border-white/5 pt-6 text-sm text-slate-400">
            Don't have an account? 
            <a href="{{ url_for('register') }}" class="text-blue-400 hover:text-blue-300 font-semibold transition-colors duration-150 ml-1">Create Account</a>
        </div>
    </div>
</body>
</html>
