{% extends "network/layout.html" %}
{% load static %}

{% block body %}
<div class="container">
    <div class="row">
        <div class="col-md-10 mx-auto">
            <h1 class="header" style="text-align: start;">All Posts</h1>
            <form method="post" id="post-form" class="mb-4">
                {% csrf_token %}
                <input type="text" name="content" placeholder="What's on your mind?" class="inputStyling" required>
                <button type="submit" class="btn btn-primary">Post</button>
            </form>
            <div class="posts-container">
                {% for post in posts %}
                <div class="post">
                    <a href="{% url 'profile' post.user.username %}">
                        <p><strong>{{ post.user.username }}</strong></p>
                    </a>
                    <p class="text-muted" style="font-size:0.9em;">{{ post.timestamp }}</p>
                    <p id="post-content-{{ post.id }}">{{ post.content }}</p>
                    <div class="post-actions">
                        <button class="post-action-btn like" data-post-id="{{ post.id }}">
                            <i class="fa-regular fa-heart"></i>
                            <span class="like-count">{{ post.likes.count }}</span>
                        </button>
                        <button class="post-action-btn comment" title="Comment"><i
                                class="fa-regular fa-comment"></i></button>
                        <button class="post-action-btn edit" title="Edit" data-post-id="{{ post.id }}"
                            data-content="{{ post.content }}" data-user-id="{{ post.user.id }}"><i
                                class="fa-regular fa-pen-to-square"></i></button>
                        <button class="post-action-btn delete" title="Delete" data-post-id="{{ post.id }}"
                            data-content="{{ post.content }}" data-user-id="{{ post.user.id }}"><i
                                class="fa-regular fa-trash-can"></i></button>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
