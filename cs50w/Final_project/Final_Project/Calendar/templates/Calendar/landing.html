{% extends "Calendar/layout.html" %}

{% block body %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <h1 class="display-4 mb-4">Welcome to Your Calendar App</h1>
            <p class="lead mb-4">Organize your schedule, manage tasks, and stay on top of your events.</p>
            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                <a href="{% url 'login' %}" class="btn btn-primary btn-lg px-4 me-sm-3 login">Log In</a>
                <a href="{% url 'register' %}" class="btn btn-outline-secondary btn-lg px-4 register">Register</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
