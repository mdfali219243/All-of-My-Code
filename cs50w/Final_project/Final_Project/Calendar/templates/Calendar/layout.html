{% load static %}

<!DOCTYPE html>
<html lang="en">

    <head>
        <title>{% block title %}Calendar{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
        <link href="{% static 'Calendar/style.css' %}" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        {% if user.is_authenticated %}
        <script>
            window.currentUserId = '{{ user.id|escapejs }}';
        </script>
        {% endif %}
    </head>

    <body class="h-screen flex flex-col">
        <nav class="navbar navbar-expand-lg navbar-light bg-light flex-shrink-0">
            <div class="container-fluid">
                {% include "Calendar/menu.html" %}
            </div>
        </nav>

        <div class="main-container">
            <div class="flex-grow container-fluid flex">
                {% block body %}
                {% endblock %}
            </div>
        </div>

        <!-- Bootstrap JavaScript at end of body for proper DOM initialization -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
            crossorigin="anonymous"></script>
        <script src="{% static 'Calendar/menu.js' %}"></script>
        {% block script %}
        {% endblock %}
        <script src="{% static 'Calendar/theme.js' %}"></script>
        <script src="{% static 'Calendar/sidebar.js' %}"></script>
        <script src="{% static 'Calendar/openAddEventModal.global.js' %}"></script>
        <script src="{% static 'Calendar/index.js' %}"></script>
    </body>

</html>
