{% load static %}

<!DOCTYPE html>
<html lang="en">

    <head>
        <title>{% block title %}Calendar{% endblock %}</title>
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
            integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
        <link href="{% static 'Calendar/style.css' %}" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        {% if user.is_authenticated %}
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            window.currentUserId = '{{ user.id|escapejs }}';
        </script>
        {% endif %}
        <script src="{% static 'Calendar/index.js' %}"></script>
    </head>

    <body>
        <div class="container">

            <nav class="navbar navbar-expand-lg navbar-light bg-light" style="width: 100%; display: flex;">
                <div class="navbar-nav custom-nav" style="width: 100%;">
                    {% include "Calendar/menu.html" %}
                </div>
            </nav>

            <div class="body">
                {% block body %}
                {% endblock %}
            </div>
        </div>
    </body>

</html>
