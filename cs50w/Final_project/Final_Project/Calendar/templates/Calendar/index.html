{% extends 'Calendar/layout.html' %}
{% load static %}

{% block body %}
<div class="main-view flex flex-col flex-grow p-4 bg-white rounded-lg shadow-md">

    <!-- month calendar view-->
    <div id="monthView" class="month-view">
        <div class="add_event"></div>
        <div
            class="daysOfWeekHeader grid grid-cols-7 text-center font-medium text-gray-600 border-b border-gray-200 pb-2 mb-2">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
        </div>
        <!-- Month calendar grid will be populated here -->
        <div id="monthGrid" class="month-grid grid grid-cols-7">
            <!-- Month dates will be populated by JavaScript -->
        </div>
    </div>

    <!-- week calendar view-->
    <div id="weekView" class="week-view">

        <div class="week-date-range-container mb-2">
            <div id="weekDateRange" class="font-semibold text-lg text-center"></div>
        </div>

        <div
            class="daysOfWeekHeader grid grid-cols-7 text-center font-medium text-gray-600 border-b border-gray-200 pb-2 mb-2">
            <div></div>
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
        </div>

        <div id="weekAllDayRow" class="week-all-day-row">
            <div class="time-label">All-day</div>
            <div id="weekAllDayEvents" class="all-day-events-container">
                <!-- All-day events will be populated by JavaScript -->
            </div>
        </div>
        <!-- Time grid -->
        <div id="weekTimeGrid" class="week-time-grid">
            <!-- Time grid will be populated by JavaScript -->
        </div>

    </div>

    <!-- day calendar view-->
    <div id="dayView" class="day-view" style="display: none;">
        <!-- date header will be populated by JavaScript -->
        <div class="day-view-content">
            <!-- All-day row-->
            <div id="dayAllDayRow" class="day-all-day-row">
                <div class="time-label">All-day</div>
                <div id="dayAllDayEvents" class="all-day-events-container">
                    <!-- All-day events will be populated by JavaScript -->
                </div>
            </div>
            <div id="dayTimeGrid" class="day-time-grid"></div>
        </div>
    </div>

    <!-- year calendar view-->
    <div id="yearView" class="year-view">
        <div id="yearGrid" class="year-grid"></div>
    </div>

</div>

{% endblock %}
