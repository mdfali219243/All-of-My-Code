{% load static %}
{% if user.is_authenticated %}
<div class="left-menu">
    <!-- Feature Menu -->
    <div class="feature-menu" style="position: relative;">
        <button id="featureMenuBtn" style="background: none; border: none; cursor: pointer;">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-list"
                viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                    d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5" />
            </svg>
        </button>
        <ul id="featureDropdown" class="py-2"
            style="display: none; position: absolute; left: 0; top: 36px; background: #fff; border: 1px solid #ccc; box-shadow: 0 2px 6px rgba(0,0,0,0.1); z-index: 10; min-width: 180px;">
            <li><a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">My Calendar</a></li>
            <li><a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Events</a></li>
            <li><a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Tasks</a></li>
            <li><a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Reminders</a></li>
            <li><a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Settings</a></li>
        </ul>
    </div>
    <div class="nav-item">
        <!-- User icon -->
        <a class="nav-link" href="{% url 'index' %}">
            <strong>
                <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor"
                    class="bi bi-person-circle" viewBox="0 0 16 16">
                    <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0" />
                    <path fill-rule="evenodd"
                        d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1" />
                </svg>
            </strong>
        </a>
    </div>
    <div class="nav-item">
        <!-- Settings icon -->
        <a class="nav-link" href="{% url 'settings' %}">
            <strong>
                <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor"
                    class="bi bi-gear-wide-connected" viewBox="0 0 16 16">
                    <path
                        d="M7.068.727c.243-.97 1.62-.97 1.864 0l.071.286a.96.96 0 0 0 1.622.434l.205-.211c.695-.719 1.888-.03 1.613.931l-.08.284a.96.96 0 0 0 1.187 1.187l.283-.081c.96-.275 1.65.918.931 1.613l-.211.205a.96.96 0 0 0 .434 1.622l.286.071c.97.243.97 1.62 0 1.864l-.286.071a.96.96 0 0 0-.434 1.622l.211.205c.719.695.03 1.888-.931 1.613l-.284-.08a.96.96 0 0 0-1.187 1.187l.081.283c.275.96-.918 1.65-1.613.931l-.205-.211a.96.96 0 0 0-1.622.434l-.071.286c-.243.97-1.62.97-1.864 0l-.071-.286a.96.96 0 0 0-1.622-.434l-.205.211c-.695.719-1.888.03-1.613-.931l.08-.284a.96.96 0 0 0-1.186-1.187l-.284.081c-.96.275-1.65-.918-.931-1.613l.211-.205a.96.96 0 0 0-.434-1.622l-.286-.071c-.97-.243-.97-1.62 0-1.864l.286-.071a.96.96 0 0 0 .434-1.622l-.211-.205c-.719-.695-.03-1.888.931-1.613l.284.08a.96.96 0 0 0 1.187-1.186l-.081-.284c-.275-.96.918-1.65 1.613-.931l.205.211a.96.96 0 0 0 1.622-.434zM12.973 8.5H8.25l-2.834 3.779A4.998 4.998 0 0 0 12.973 8.5m0-1a4.998 4.998 0 0 0-7.557-3.779l2.834 3.78zM5.048 3.967l-.087.065zm-.431.355A4.98 4.98 0 0 0 3.002 8c0 1.455.622 2.765 1.615 3.678L7.375 8zm.344 7.646.087.065z" />
                </svg>
            </strong>
        </a>
    </div>
</div>
<div class="center-menu">
    <div class="nav-item d-flex align-items-center gap-3">
        <!-- today button -->
        <button class="today-button btn btn-outline-secondary">Today</button>
        <!-- prev and next buttons -->
        <div class="d-flex align-items-center gap-2">
            <button id="prevBtn" class="icon-button btn btn-outline-secondary" aria-label="Previous Month">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd"
                        d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z" />
                </svg>
            </button>
            <!-- current display -->
            <div id="currentDisplay" class="current-display fw-bold">July 2025</div>
            <!-- next button -->
            <button id="nextBtn" class="icon-button btn btn-outline-secondary" aria-label="Next Month">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd"
                        d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z" />
                </svg>
            </button>
        </div>
    </div>
</div>

<!-- Calendar View Dropdown -->
<div class="center-menu">
    <div class="nav-item">
        <div class="dropdown">
            <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"
                aria-expanded="false">
                month
            </button>
            <ul class="dropdown-menu">
                <li><button class="dropdown-item weekViewBtn" type="button">Week</button></li>
                <li><button class="dropdown-item dayViewBtn" type="button">Day</button></li>
                <li><button class="dropdown-item monthViewBtn" type="button">Month</button></li>
                <li><button class="dropdown-item yearViewBtn" type="button">Year</button></li>
            </ul>
        </div>
    </div>
</div>


<!-- tasks and logout -->
<div class="right-menu">
    <div class="nav-item">
        <a class="nav-link" href="{% url 'settings' %}">Settings</a>
    </div>
    <div class="nav-item">
        <a class="nav-link" href="{% url 'tasks' %}">Tasks</a>
    </div>
    <div class="nav-item">
        <a class="nav-link" href="{% url 'logout' %}">Log Out</a>
    </div>
</div>

{% else %}
<!-- Unauthenticated menu -->
<div class="right-menu">
    <div class="nav-item">
        <a class="nav-link" href="{% url 'login' %}">Log In</a>
    </div>
    <div class="nav-item">
        <a class="nav-link" href="{% url 'register' %}">Register</a>
    </div>
</div>
{% endif %}
