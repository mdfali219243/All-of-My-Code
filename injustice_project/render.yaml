# Render.com — deploy the Django API (free tier)
# Dashboard: https://dashboard.render.com → New → Blueprint
# Or connect this repo and point root directory to injustice_project/injustice

services:
  - type: web
    name: injustice-api
    runtime: python
    rootDir: injustice_project/injustice
    buildCommand: pip install -r ../requirements.txt && python manage.py migrate
    # Longer timeout for large debate recording uploads (default 30s is too short).
    startCommand: gunicorn injustice.wsgi:application --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: injustice-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://project-injustice.com,https://www.project-injustice.com,https://injustice-nine.vercel.app
