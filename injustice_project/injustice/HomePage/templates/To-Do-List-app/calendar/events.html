<!DOCTYPE html>
<html lang="en">

    <head>
        <title>All Events</title>
        <link rel="icon"
            href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                darkMode: 'class',
            }
        </script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
            crossorigin="anonymous">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style/home_page.css">
        <link rel="stylesheet" href="style/event_blocks.css">
        <link rel="stylesheet" href="style/tasks.css">
        <link rel="stylesheet" href="style/dark_mode.css">
        <style>
            .event-card {
                transition: all 0.2s ease-in-out;
            }

            .event-card:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            }
        </style>
    </head>

    <body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100">

        <!-- Feature Menu -->
        <div class="feature-menu" id="featureMenu">
            <div class="p-4 flex items-center justify-between border-b border-gray-200">
                <h2 class="text-xl font-semibold text-gray-700 dark:text-gray-200">Calendar Menu</h2>
                <button class="icon-button" id="closeMenuBtn" aria-label="Close navigation menu">
                    <svg fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                    </svg>
                </button>
            </div>
            <ul class="py-2">
                <li><a href="index.html"
                        class="block px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">My
                        Calendar</a></li>
                <li><a href="events.html"
                        class="block px-4 py-2 text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-gray-800 font-semibold">Events</a>
                </li>
                <li><a href="tasks.html"
                        class="block px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">Tasks</a>
                </li>
                <li><a href="settings.html"
                        class="block px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">Settings</a>
                </li>
            </ul>
        </div>

        <!-- Overlay for when the menu is open -->
        <div class="overlay" id="overlay"></div>

        <!-- Header -->
        <div class="header">
            <div class="left-section">
                <button class="icon-button" id="openMenuBtn" aria-label="Open navigation menu">
                    <svg fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
                    </svg>
                </button>
                <h1 class="text-xl font-bold ml-4 text-gray-800 dark:text-white hidden sm:block">All Events</h1>
            </div>

            <div class="right-section">
                <button id="themeToggleBtn" class="icon-button mr-2" aria-label="Toggle Theme">
                    <i class="fas fa-moon"></i>
                </button>
                <img class="user-profile-pic" src="https://placehold.co/32x32/FFC107/FFFFFF?text=U"
                    alt="User Profile Picture">
            </div>
        </div>

        <div class="main-container flex flex-1 p-6 overflow-y-auto">
            <div class="max-w-6xl mx-auto w-full">

                <!-- Controls -->
                <div
                    class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-4 mb-6 flex flex-col md:flex-row gap-4 items-center justify-between">

                    <!-- Search -->
                    <div class="relative w-full md:w-96">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fas fa-search"></i>
                        </span>
                        <input type="text" id="eventSearch"
                            class="w-full pl-10 pr-4 py-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-700/50 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all dark:text-white"
                            placeholder="Search events...">
                    </div>

                    <!-- Filters -->
                    <div class="flex bg-gray-100 dark:bg-gray-700/50 p-1 rounded-lg">
                        <button
                            class="filter-btn px-4 py-1.5 rounded-md text-sm font-medium transition-all active-filter bg-white dark:bg-gray-600 shadow-sm text-blue-600 dark:text-blue-300"
                            data-filter="upcoming">Upcoming</button>
                        <button
                            class="filter-btn px-4 py-1.5 rounded-md text-sm font-medium transition-all text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-200"
                            data-filter="past">Past</button>
                        <button
                            class="filter-btn px-4 py-1.5 rounded-md text-sm font-medium transition-all text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-200"
                            data-filter="all">All</button>
                    </div>
                </div>

                <!-- Stats -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-gradient-to-br from-blue-500 to-blue-600 rounded-xl p-5 text-white shadow-lg">
                        <div class="text-blue-100 text-sm font-medium mb-1">Total Events</div>
                        <div class="text-3xl font-bold" id="totalEventsCount">0</div>
                        <div class="mt-2 text-xs text-blue-100 bg-blue-600/30 inline-block px-2 py-0.5 rounded">All time
                        </div>
                    </div>
                    <div class="bg-gradient-to-br from-purple-500 to-purple-600 rounded-xl p-5 text-white shadow-lg">
                        <div class="text-purple-100 text-sm font-medium mb-1">Upcoming</div>
                        <div class="text-3xl font-bold" id="upcomingEventsCount">0</div>
                        <div class="mt-2 text-xs text-purple-100 bg-purple-600/30 inline-block px-2 py-0.5 rounded">Next
                            7 days</div>
                    </div>
                    <div
                        class="bg-white dark:bg-gray-800 rounded-xl p-5 border border-gray-200 dark:border-gray-700 shadow-sm flex items-center justify-between">
                        <div>
                            <div class="text-gray-500 dark:text-gray-400 text-sm font-medium mb-1">Next Event</div>
                            <div class="text-lg font-bold text-gray-800 dark:text-gray-100 truncate max-w-[200px]"
                                id="nextEventName">None</div>
                            <div class="text-xs text-gray-500" id="nextEventTime">--</div>
                        </div>
                        <div
                            class="w-12 h-12 bg-green-100 dark:bg-green-900/30 rounded-full flex items-center justify-center text-green-600 dark:text-green-400">
                            <i class="far fa-calendar-check text-xl"></i>
                        </div>
                    </div>
                </div>

                <!-- Events List -->
                <div id="eventsListContainer" class="space-y-4">
                    <!-- Events will be injected here -->
                    <div class="text-center py-12 text-gray-500">
                        <i class="fas fa-spinner fa-spin text-2xl mb-3"></i>
                        <p>Loading events...</p>
                    </div>
                </div>

            </div>
        </div>

        <!-- Same Modals as index.html for viewing/editing -->
        <!-- View Event Modal -->
        <div class="modal fade" id="viewEventModal" tabindex="-1" aria-labelledby="viewEventModalLabel"
            aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="viewEventTitle">Event Details</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p><strong>Date:</strong> <span id="viewEventDate"></span></p>
                        <p><strong>Time:</strong> <span id="viewEventTime"></span></p>
                        <p><strong>Description:</strong> <span id="viewEventDescription"></span></p>
                        <p><strong>Color:</strong> <span id="viewEventColor"></span></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger" id="deleteEventBtn">Delete</button>
                        <button type="button" class="btn btn-primary" id="editEventBtn">Edit</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Scripts -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
            crossorigin="anonymous"></script>
        <script src="javascript/theme.js"></script>
        <script src="javascript/menu.js"></script> <!-- Reusing menu logic -->
        <script src="javascript/events-page.js"></script>
    </body>

</html>
