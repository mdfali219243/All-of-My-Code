<!-- Share Modal -->
<div id="shareModal" class="hidden fixed inset-0 bg-black/60 z-[100] flex items-end sm:items-center justify-center p-0 sm:p-4" aria-hidden="true">
    <div class="bg-[#242526] w-full sm:max-w-md rounded-t-2xl sm:rounded-xl shadow-2xl border border-[#393a3b] overflow-hidden">
        <div class="flex justify-between items-center p-4 border-b border-[#393a3b]">
            <h3 class="text-lg font-bold text-white">Share post</h3>
            <button type="button" id="closeShareModal" class="w-8 h-8 rounded-full bg-[#3a3b3c] flex items-center justify-center hover:bg-[#4e4f50] text-gray-300 transition" aria-label="Close">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
            </button>
        </div>

        <div class="p-2">
            <button type="button" data-share-action="feed" class="share-option w-full flex items-center gap-3 p-3 rounded-xl hover:bg-[#3a3b3c] transition text-left">
                <span class="w-10 h-10 rounded-full bg-indigo-600/20 text-indigo-400 flex items-center justify-center flex-shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M15 8a3 3 0 10-2.977-2.63l-4.94 2.47a3 3 0 100 4.319l4.94 2.47a3 3 0 10.895-1.789l-4.94-2.47a3.027 3.027 0 000-.74l4.94-2.47C13.456 7.68 14.19 8 15 8z" /></svg>
                </span>
                <div>
                    <p class="font-semibold text-white text-[15px]">Share to your profile</p>
                    <p class="text-xs text-gray-400">Post this on your timeline</p>
                </div>
            </button>

            <button type="button" data-share-action="copy" class="share-option w-full flex items-center gap-3 p-3 rounded-xl hover:bg-[#3a3b3c] transition text-left">
                <span class="w-10 h-10 rounded-full bg-green-600/20 text-green-400 flex items-center justify-center flex-shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M8 2a1 1 0 000 2h2a1 1 0 100-2H8z" /><path d="M3 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v6h-4.586l1.293-1.293a1 1 0 00-1.414-1.414l-3 3a1 1 0 000 1.414l3 3a1 1 0 001.414-1.414L10.414 13H15v3a2 2 0 01-2 2H5a2 2 0 01-2-2V5z" /></svg>
                </span>
                <div>
                    <p class="font-semibold text-white text-[15px]">Copy link</p>
                    <p class="text-xs text-gray-400">Copy a link to this post</p>
                </div>
            </button>

            <button type="button" data-share-action="native" class="share-option w-full flex items-center gap-3 p-3 rounded-xl hover:bg-[#3a3b3c] transition text-left sm:hidden">
                <span class="w-10 h-10 rounded-full bg-blue-600/20 text-blue-400 flex items-center justify-center flex-shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" /></svg>
                </span>
                <div>
                    <p class="font-semibold text-white text-[15px]">Share via…</p>
                    <p class="text-xs text-gray-400">Use your device share menu</p>
                </div>
            </button>

            <div class="border-t border-[#393a3b] mt-1 pt-1">
                <p class="px-3 py-2 text-xs font-semibold text-gray-400 uppercase tracking-wide">Send in a message</p>
                <div id="shareContactList" class="max-h-[200px] overflow-y-auto">
                    <p class="px-3 py-4 text-sm text-gray-400 text-center">Loading contacts…</p>
                </div>
            </div>
        </div>

        <div id="shareToast" class="hidden mx-4 mb-4 p-3 rounded-lg bg-indigo-600/20 border border-indigo-500/30 text-indigo-300 text-sm text-center"></div>
    </div>
</div>

<script>
(function() {
    if (window.shareModalInit) return;
    window.shareModalInit = true;

    const modal = document.getElementById('shareModal');
    const contactList = document.getElementById('shareContactList');
    const toast = document.getElementById('shareToast');
    let activePostId = null;
    let contactsLoaded = false;

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    const csrftoken = getCookie('csrftoken');

    function showShareToast(message, isError) {
        toast.textContent = message;
        toast.classList.remove('hidden', 'bg-indigo-600/20', 'border-indigo-500/30', 'text-indigo-300', 'bg-red-600/20', 'border-red-500/30', 'text-red-300');
        if (isError) {
            toast.classList.add('bg-red-600/20', 'border-red-500/30', 'text-red-300');
        } else {
            toast.classList.add('bg-indigo-600/20', 'border-indigo-500/30', 'text-indigo-300');
        }
        setTimeout(() => toast.classList.add('hidden'), 2500);
    }

    function postLink() {
        return `${window.location.origin}/#post-${activePostId}`;
    }

    function loadContacts() {
        if (contactsLoaded) return;
        fetch('/share/contacts/')
            .then(r => r.json())
            .then(data => {
                contactsLoaded = true;
                contactList.innerHTML = '';
                if (!data.contacts.length) {
                    contactList.innerHTML = '<p class="px-3 py-4 text-sm text-gray-400 text-center">Follow people to send posts in messages.</p>';
                    return;
                }
                data.contacts.forEach(c => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'w-full flex items-center gap-3 p-3 rounded-xl hover:bg-[#3a3b3c] transition text-left';
                    btn.dataset.shareAction = 'dm';
                    btn.dataset.username = c.username;
                    btn.innerHTML = `
                        <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(c.username)}&background=2563eb&color=fff" class="w-9 h-9 rounded-full" alt="">
                        <span class="font-medium text-white text-[15px]">${c.display_name}</span>`;
                    contactList.appendChild(btn);
                });
            });
    }

    window.openShareModal = function(postId) {
        activePostId = postId;
        toast.classList.add('hidden');
        modal.classList.remove('hidden');
        modal.setAttribute('aria-hidden', 'false');
        loadContacts();
    };

    function closeModal() {
        modal.classList.add('hidden');
        modal.setAttribute('aria-hidden', 'true');
        activePostId = null;
    }

    document.getElementById('closeShareModal').addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

    modal.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-share-action]');
        if (!btn || !activePostId) return;

        const action = btn.dataset.shareAction;

        if (action === 'copy') {
            navigator.clipboard.writeText(postLink()).then(() => {
                showShareToast('Link copied to clipboard!');
                setTimeout(closeModal, 1200);
            });
            return;
        }

        if (action === 'native' && navigator.share) {
            navigator.share({ title: 'Project Injustice', url: postLink() }).catch(() => {});
            return;
        }

        const formData = new FormData();
        formData.append('action', action);
        if (action === 'dm') formData.append('username', btn.dataset.username);

        fetch(`/post/${activePostId}/share/`, {
            method: 'POST',
            headers: { 'X-CSRFToken': csrftoken },
            body: formData,
        })
        .then(r => r.json())
        .then(data => {
            if (data.status === 'ok') {
                showShareToast(data.message);
                if (action === 'feed') setTimeout(() => window.location.reload(), 1200);
                else setTimeout(closeModal, 1200);
            } else {
                showShareToast(data.message || 'Something went wrong', true);
            }
        });
    });

    document.addEventListener('click', (e) => {
        const btn = e.target.closest('.share-btn');
        if (btn) {
            e.preventDefault();
            openShareModal(btn.dataset.postId);
        }
    });
})();
</script>
