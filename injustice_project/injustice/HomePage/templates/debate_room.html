<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ room.topic }} | Live Debate</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Jitsi Meet API -->
    <script src="https://jitsi.riot.im/external_api.js"></script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        }
    </script>
</head>
<body class="bg-[#18191a] text-slate-200 font-sans h-screen overflow-hidden flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="flex-shrink-0 w-full h-[60px] bg-[#242526] border-b border-[#393a3b] shadow-md flex items-center justify-between px-4 z-50">
        <div class="flex items-center gap-3">
            <a href="{% url 'home' %}" class="w-10 h-10 rounded-full hover:bg-[#3a3b3c] flex items-center justify-center text-gray-400 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
            </a>
            <div class="flex flex-col">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span>
                    <h1 class="font-bold text-lg text-white leading-tight truncate max-w-[200px] sm:max-w-[400px]">{{ room.topic }}</h1>
                </div>
                <p class="text-xs text-gray-400">Hosted by {{ room.creator.first_name|default:room.creator.username }}</p>
            </div>
        </div>
        
        <!-- Action Buttons -->
        <div class="flex items-center gap-2">
            <button onclick="copyInviteLink(this)" class="bg-[#3a3b3c] hover:bg-[#4e4f50] text-gray-200 text-sm font-semibold px-4 py-1.5 rounded-full flex items-center gap-2 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" /></svg>
                <span class="btn-text">Share Link</span>
            </button>
        </div>
    </header>

    <!-- Jitsi Video Call Area -->
    <main class="flex-1 w-full bg-black relative" id="jitsi-container">
        <!-- The Jitsi iframe will be injected here -->
    </main>

    <!-- Interactive Logic Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const domain = 'jitsi.riot.im';
            
            // Create a safe slug for the room name to ensure it's a valid URL string
            const rawTopic = "{{ room.topic|escapejs }}";
            const safeTopic = rawTopic.replace(/[^a-zA-Z0-9]/g, '_').substring(0, 30);
            const roomName = `Injustice_Debate_{{ room.id }}_${safeTopic}`;

            const options = {
                roomName: roomName,
                width: '100%',
                height: '100%',
                parentNode: document.querySelector('#jitsi-container'),
                userInfo: {
                    displayName: "{{ user.first_name|default:user.username|escapejs }}"
                },
                configOverwrite: { 
                    startWithAudioMuted: false,
                    startWithVideoMuted: false,
                    prejoinPageEnabled: false // Skip the intermediate prejoin page
                }
            };
            
            const api = new JitsiMeetExternalAPI(domain, options);
            
            // Redirect to home when user hangs up
            api.addEventListener('videoConferenceLeft', () => {
                window.location.href = "{% url 'home' %}";
            });
        });

        // Copy Invite Link Function
        function copyInviteLink(btn) {
            navigator.clipboard.writeText(window.location.href).then(() => {
                const textSpan = btn.querySelector('.btn-text');
                const originalText = textSpan.innerText;
                textSpan.innerText = 'Copied!';
                btn.classList.replace('bg-[#3a3b3c]', 'bg-green-600');
                btn.classList.replace('hover:bg-[#4e4f50]', 'hover:bg-green-700');
                setTimeout(() => {
                    textSpan.innerText = originalText;
                    btn.classList.replace('bg-green-600', 'bg-[#3a3b3c]');
                    btn.classList.replace('hover:bg-green-700', 'hover:bg-[#4e4f50]');
                }, 2000);
            }).catch(err => {
                alert("Failed to copy link. Please manually copy the URL in your browser's address bar.");
            });
        }
    </script>
</body>
</html>
