<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reels - Project Injustice</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        
        .music-disc {
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-black text-white font-sans h-screen w-screen overflow-hidden sm:bg-slate-900 flex justify-center">

    <!-- Mobile container -->
    <main class="w-full h-full sm:w-[450px] sm:h-[90vh] sm:mt-[5vh] bg-black relative shadow-[0_0_50px_rgba(0,0,0,0.5)] sm:border sm:border-slate-800 sm:rounded-2xl overflow-y-scroll snap-y snap-mandatory no-scrollbar">

        <!-- Header Navigation Overlay -->
        <div class="fixed sm:absolute top-0 left-0 w-full z-50 p-4 pt-6 flex justify-between items-center pointer-events-none">
            <a href="{% url 'home' %}" class="pointer-events-auto text-white drop-shadow-md hover:text-slate-300 transition p-2 bg-black/20 rounded-full backdrop-blur-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                </svg>
            </a>
            <div class="flex gap-6 font-bold text-lg drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] pointer-events-auto">
                <span class="text-slate-300/80 hover:text-white cursor-pointer transition">Following</span>
                <span class="text-white relative after:content-[''] after:absolute after:-bottom-2 after:left-1/2 after:-translate-x-1/2 after:w-5 after:h-[3px] after:bg-white after:rounded-full">For You</span>
            </div>
            <div class="w-10"></div>
        </div>

        <!-- Reel 1 -->
        <div class="reel-item relative w-full h-full snap-start snap-always bg-slate-900 flex items-center justify-center group overflow-hidden">
            <video class="absolute inset-0 w-full h-full object-cover scale-105" 
                   src="https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" 
                   loop muted playsinline preload="auto">
            </video>
            
            <div class="absolute inset-0 z-10 flex items-center justify-center opacity-0 group-hover:opacity-100 transition duration-300 cursor-pointer play-pause-overlay">
                <div class="bg-black/40 rounded-full p-6 backdrop-blur-sm pointer-events-none icon-container transition duration-300">
                     <svg class="w-12 h-12 text-white play-icon" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </div>
            </div>

            <div class="absolute inset-x-0 bottom-0 h-1/2 bg-gradient-to-t from-black/90 via-black/40 to-transparent pointer-events-none z-20"></div>

            <div class="absolute bottom-0 left-0 w-full p-4 pb-6 flex items-end justify-between z-30 pointer-events-none">
                
                <div class="flex-1 mr-12 pointer-events-auto">
                    <h3 class="font-bold text-lg mb-1.5 drop-shadow-md hover:underline cursor-pointer">@global_initiatives</h3>
                    <p class="text-sm text-slate-50 drop-shadow-md mb-4 line-clamp-2 leading-relaxed">Working together to make the world a better place. See what's happening locally! <span class="font-bold">#community</span> <span class="font-bold">#action</span></p>
                    
                    <div class="flex items-center gap-2 text-sm max-w-[200px] bg-black/20 backdrop-blur-md rounded-full px-3 py-1.5 border border-white/10 w-max">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 drop-shadow-md" viewBox="0 0 20 20" fill="currentColor">
                          <path d="M18 3a1 1 0 00-1.196-.98l-10 2A1 1 0 006 5v9.114A4.369 4.369 0 005 14c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2V7.82l8-1.6v5.894A4.37 4.37 0 0015 12c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2V3z" />
                        </svg>
                        <div class="marquee w-32 overflow-hidden whitespace-nowrap drop-shadow-md">
                            <span class="inline-block animate-[marquee_5s_linear_infinite]">Original Sound - Global Initiatives</span>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col items-center gap-5 pb-2 pointer-events-auto absolute right-4 bottom-6 z-40">
                    <div class="relative w-12 h-12 rounded-full bg-white flex flex-col justify-center items-center p-0.5 cursor-pointer shadow-lg hover:scale-105 transition">
                        <img src="https://ui-avatars.com/api/?name=GI&background=2563eb&color=fff" class="w-full h-full rounded-full object-cover">
                        <button class="absolute -bottom-2 w-5 h-5 bg-pink-500 rounded-full flex items-center justify-center border-2 border-black/80">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-white font-bold" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                            </svg>
                        </button>
                    </div>

                    <button class="flex flex-col items-center gap-1 group action-btn mt-2">
                        <div class="w-10 h-10 flex items-center justify-center drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] group-active:scale-90 transition-transform">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-9 w-9 text-white group-hover:text-pink-500 transition-colors" fill="currentColor" viewBox="0 0 24 24" stroke="black" stroke-width="0.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
                            </svg>
                        </div>
                        <span class="text-xs font-semibold drop-shadow-[0_2px_2px_rgba(0,0,0,1)] text-white/90 tracking-wide">1.2M</span>
                    </button>

                    <button class="flex flex-col items-center gap-1 group action-btn">
                        <div class="w-10 h-10 flex items-center justify-center drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] group-active:scale-90 transition-transform">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-9 w-9 text-white opacity-95 group-hover:text-gray-300 transition" fill="currentColor" viewBox="0 0 24 24" stroke="black" stroke-width="0.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 20.25c4.97 0 9-3.694 9-8.25s-4.03-8.25-9-8.25S3 7.444 3 12c0 2.104.859 4.023 2.273 5.48.432.447.74 1.04.586 1.641a4.483 4.483 0 01-.923 1.785A5.969 5.969 0 006 21c1.282 0 2.47-.402 3.445-1.087.81.22 1.668.337 2.555.337z" />
                            </svg>
                        </div>
                        <span class="text-xs font-semibold drop-shadow-[0_2px_2px_rgba(0,0,0,1)] text-white/90 tracking-wide">45K</span>
                    </button>

                    <button class="flex flex-col items-center gap-1 group action-btn">
                        <div class="w-10 h-10 flex items-center justify-center drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] group-active:scale-90 transition-transform">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-9 w-9 text-white opacity-95 group-hover:text-blue-400 transition" fill="currentColor" viewBox="0 0 24 24" stroke="black" stroke-width="0.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 100 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186l9.566-5.314m-9.566 7.5l9.566 5.314m0 0a2.25 2.25 0 103.935 2.186 2.25 2.25 0 00-3.935-2.186zm0-12.814a2.25 2.25 0 103.933-2.185 2.25 2.25 0 00-3.933 2.185z" />
                            </svg>
                        </div>
                        <span class="text-xs font-semibold drop-shadow-[0_2px_2px_rgba(0,0,0,1)] text-white/90 tracking-wide">Share</span>
                    </button>

                    <div class="w-12 h-12 rounded-full bg-[#1e1e1e] flex items-center justify-center p-2 music-disc border border-slate-600 mt-2 shadow-[0_0_15px_rgba(0,0,0,0.5)]">
                         <div class="w-full h-full rounded-full bg-gradient-to-tr from-pink-500 to-indigo-500 flex items-center justify-center overflow-hidden relative">
                            <img src="https://ui-avatars.com/api/?name=GI&background=2563eb&color=fff" class="absolute inset-0 w-full h-full opacity-50 mix-blend-overlay">
                            <div class="w-3 h-3 bg-black rounded-full z-10"></div>
                         </div>
                    </div>
                </div>

            </div>
        </div>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const reels = document.querySelectorAll('.reel-item');
            
            reels.forEach(reel => {
                const video = reel.querySelector('video');
                const overlay = reel.querySelector('.play-pause-overlay');
                const playIcon = overlay.querySelector('.play-icon');
                const discContainer = reel.querySelector('.music-disc');
                
                reel.addEventListener('click', (e) => {
                    if(e.target.closest('.action-btn') || e.target.closest('a') || e.target.closest('.marquee')) return;

                    if(video.paused) {
                        video.play();
                        playIcon.classList.add('hidden');
                        overlay.classList.remove('opacity-100');
                        discContainer.style.animationPlayState = 'running';
                    } else {
                        video.pause();
                        playIcon.classList.remove('hidden');
                        overlay.classList.add('opacity-100');
                        discContainer.style.animationPlayState = 'paused';
                    }
                });
            });

            const observerOptions = {
                root: document.querySelector('main'),
                rootMargin: '0px',
                threshold: 0.7
            };

            const observerCallback = (entries, observer) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    const overlay = entry.target.querySelector('.play-pause-overlay');
                    const playIcon = entry.target.querySelector('.play-icon');
                    const discContainer = entry.target.querySelector('.music-disc');

                    if (entry.isIntersecting) {
                        const playPromise = video.play();
                        if (playPromise !== undefined) {
                            playPromise.then(_ => {
                                playIcon.classList.add('hidden');
                                overlay.classList.remove('opacity-100');
                                discContainer.style.animationPlayState = 'running';
                            }).catch(error => {
                                video.pause();
                                playIcon.classList.remove('hidden');
                                overlay.classList.add('opacity-100', 'bg-black/40');
                                discContainer.style.animationPlayState = 'paused';
                            });
                        }
                    } else {
                        video.pause();
                        video.currentTime = 0;
                        discContainer.style.animationPlayState = 'paused';
                    }
                });
            };

            const observer = new IntersectionObserver(observerCallback, observerOptions);

            reels.forEach(reel => {
                observer.observe(reel);
            });
            
            const style = document.createElement('style');
            style.innerHTML = `
                @keyframes marquee {
                    0% { transform: translateX(100%); }
                    100% { transform: translateX(-150%); }
                }
            `;
            document.head.appendChild(style);
        });
    </script>
</body>
</html>
