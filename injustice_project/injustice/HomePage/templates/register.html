<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register - Injustice</title>
        <link rel="stylesheet" href="/static/css/register.css">
    </head>

    <body>
        <div class="register-page-wrapper">
            <!-- Decorative animated background shapes -->
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>

            <div class="register-container">
                <div class="register-header">
                    <h1>Create Account</h1>
                    <p class="subtitle">Sign up for a new Injustice account</p>
                </div>

                <form action="{% url 'register' %}" method="post" class="register-form">
                    {% csrf_token %}

                    {% if messages %}
                    <div class="messages" style="color: #ff4444; margin-bottom: 1rem; text-align: center;">
                        {% for message in messages %}
                        <p>{{ message }}</p>
                        {% endfor %}
                    </div>
                    {% endif %}

                    <div class="input-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" autocomplete="username"
                            placeholder="Enter your username" required>
                    </div>

                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" autocomplete="email" placeholder="Enter your email"
                            required>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" autocomplete="new-password"
                            placeholder="Enter your password" required>
                    </div>

                    <div class="input-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password"
                            placeholder="Confirm your password" required>
                    </div>

                    <button type="submit" class="btn-primary">Create Account</button>

                    <div class="register-footer">
                        <a href="/login" class="nav-link">Already have an account? Sign In</a>
                    </div>
                </form>
            </div>
        </div>
    </body>

</html>
